<svg xmlns="http://www.w3.org/2000/svg" width="800" height="200" viewBox="0 0 800 200" role="img" aria-label="Prism Clock: sculpted metal and native time, offline with no tracking or analytics"><defs><linearGradient id="background" x2="1" y2="1"><stop stop-color="#0c0a09"/><stop offset="1" stop-color="#1c1917"/></linearGradient><linearGradient id="metal" x2="1" y2="1"><stop stop-color="#e0e7ff"/><stop offset=".5" stop-color="#64748b"/><stop offset="1" stop-color="#c4b5fd"/></linearGradient><clipPath id="faceBounds"><rect width="185" height="132" rx="12"/></clipPath></defs><style>@keyframes breathe{0%,100%{opacity:.54}50%{opacity:1}}@keyframes float{0%,100%{transform:translateY(-3px)}50%{transform:translateY(3px)}}.facet{animation:breathe 4.5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.facet.b{animation-delay:-1.5s}.facet.c{animation-delay:-3s}.field{animation:float 6.75s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@media(prefers-reduced-motion:reduce){.facet,.field{animation:none}}</style><rect x=".5" y=".5" width="799" height="199" rx="16" fill="#fff" stroke="#e5e7eb"/><g font-family="system-ui,-apple-system,Segoe UI,sans-serif"><text x="32" y="80" fill="#0f172a" font-size="40" font-weight="700" letter-spacing="-.5">Prism Clock</text><text x="32" y="110" fill="#64748b" font-size="14">Sculpted metal. Time in motion.</text><rect x="32" y="132" width="58" height="22" rx="11" fill="#eff6ff" stroke="#bfdbfe" stroke-width=".8"/><text x="61.0" y="146" text-anchor="middle" font-size="10" font-weight="500" fill="#1e40af">Offline</text><rect x="98" y="132" width="145" height="22" rx="11" fill="#eff6ff" stroke="#bfdbfe" stroke-width=".8"/><text x="170.5" y="146" text-anchor="middle" font-size="10" font-weight="500" fill="#1e40af">No tracking or analytics</text><rect x="251" y="132" width="90" height="22" rx="11" fill="#eff6ff" stroke="#bfdbfe" stroke-width=".8"/><text x="296.0" y="146" text-anchor="middle" font-size="10" font-weight="500" fill="#1e40af">Native clock</text><g transform="translate(575 34)"><g class="field"><rect width="185" height="132" rx="12" fill="#101727"/><g clip-path="url(#faceBounds)"><path class="facet " d="M0.0,0h46.25l-23.125,44Z" fill="#c4b5fd" stroke="#253049" stroke-width=".6"/><path d="M0.0,0l23.125,44h-46.25Z" fill="url(#metal)" opacity=".7"/><path class="facet b" d="M46.25,0h46.25l-23.125,44Z" fill="#64748b" stroke="#253049" stroke-width=".6"/><path d="M46.25,0l23.125,44h-46.25Z" fill="url(#metal)" opacity=".7"/><path class="facet c" d="M92.5,0h46.25l-23.125,44Z" fill="#e0e7ff" stroke="#253049" stroke-width=".6"/><path d="M92.5,0l23.125,44h-46.25Z" fill="url(#metal)" opacity=".7"/><path class="facet " d="M138.75,0h46.25l-23.125,44Z" fill="#94a3b8" stroke="#253049" stroke-width=".6"/><path d="M138.75,0l23.125,44h-46.25Z" fill="url(#metal)" opacity=".7"/><path class="facet b" d="M0.0,44h46.25l-23.125,44Z" fill="#e0e7ff" stroke="#253049" stroke-width=".6"/><path d="M0.0,44l23.125,44h-46.25Z" fill="url(#metal)" opacity=".7"/><path class="facet c" d="M46.25,44h46.25l-23.125,44Z" fill="#94a3b8" stroke="#253049" stroke-width=".6"/><path d="M46.25,44l23.125,44h-46.25Z" fill="url(#metal)" opacity=".7"/><path class="facet " d="M92.5,44h46.25l-23.125,44Z" fill="#475569" stroke="#253049" stroke-width=".6"/><path d="M92.5,44l23.125,44h-46.25Z" fill="url(#metal)" opacity=".7"/><path class="facet b" d="M138.75,44h46.25l-23.125,44Z" fill="#a5b4fc" stroke="#253049" stroke-width=".6"/><path d="M138.75,44l23.125,44h-46.25Z" fill="url(#metal)" opacity=".7"/><path class="facet c" d="M0.0,88h46.25l-23.125,44Z" fill="#475569" stroke="#253049" stroke-width=".6"/><path d="M0.0,88l23.125,44h-46.25Z" fill="url(#metal)" opacity=".7"/><path class="facet " d="M46.25,88h46.25l-23.125,44Z" fill="#a5b4fc" stroke="#253049" stroke-width=".6"/><path d="M46.25,88l23.125,44h-46.25Z" fill="url(#metal)" opacity=".7"/><path class="facet b" d="M92.5,88h46.25l-23.125,44Z" fill="#c4b5fd" stroke="#253